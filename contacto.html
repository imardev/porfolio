<body>
    <!-- Barra de navegación -->
    <header>

            </div>
            <div class="lightmode">

        </button>
    </header>
    <!-- Contenido principal-->
    <main>
        <h1>Contacto</h1>
        <p class="description">Disponible para incorporarme a equipos y proyectos de desarrollo web.</p>
        <form action="https://api.web3forms.com/submit" method="POST" class="form-floating" id="form">
            <input type="hidden" name="access_key" value="6643e89e-adfb-435c-98fa-8513692c2867">
            <input type="hidden" name="from_name" value="Portfolio - Contacto Form">
            <div class="user-info">
                <div class="form-floating mb-3 name">
                    <input type="text" class="form-control input-name" id="contactName" placeholder="nombre:" required
                        name="name" autocomplete="name">
                    <label for="contactName">Nombre</label>
                    <p id="messageName"></p>
                </div>
                <div class="form-floating mb-3 email">
                    <input type="email" class="form-control input-email" id="contactEmail"
                        placeholder="name@example.com" name="email" required autocomplete="email">
                    <label for="contactEmail">Correo Electrónico</label>
                    <p id="messageEmail"></p>
                </div>

            </div>
            <div class="form-floating mb-3 email">
                <input type="text" class="form-control" id="contactCompany" placeholder="Empresa S.L." name="company" autocomplete="organization">
                <label for="contactCompany">Empresa (opcional)</label>
            </div>
            <select class="form-select mb-3" aria-label="Tipo de oportunidad" name="opportunity_type" required>
                <option value="" selected disabled>Tipo de oportunidad</option>
                <option value="Propuesta laboral">Propuesta laboral</option>
                <option value="Incorporación a equipo">Incorporación a equipo</option>
                <option value="Consulta profesional">Consulta profesional</option>
                <option value="Información adicional sobre mi perfil">Información adicional sobre mi perfil</option>
                <option value="Otra">Otra</option>
            </select>


            <div class="form-floating mb-3">
                <textarea class="form-control contact-textarea" placeholder="Escribe tu mensaje" id="floatingTextarea"
                    name="message" required></textarea>
                <label for="floatingTextarea" class="text-area-label">Mensaje</label>
            </div>
            <input type="text" name="botcheck" style="display: none;" />
            <div class="h-captcha" data-captcha="true" id="captcha"></div>
            <p class="privacy-note">Usaré estos datos solo para responder a tu mensaje. El formulario se envía a través de
                <a href="https://web3forms.com/" target="_blank">Web3Forms</a>.</p>
            <button type="submit" class="btn btn-primary" id="submitBtn">Contactar</button>
        </form>
    </main>
    <script src="https://web3forms.com/client/script.js" async defer></script>
